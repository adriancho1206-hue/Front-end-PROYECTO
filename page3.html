<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Lavado de Vehículos</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="encabezado">
        <div>
            <h1>Cyberlink Solutions</h1>
        </div>

        <div class="usuario">
            <span><img src="Logo CYBERLINK.png" alt="Logo" style="border-radius: 150px; width: 70px;"></span>
        </div>
    
</header>


    <button type="submit" class="btn-cancelar">Cancelar operacion</button><<<
    
  
        <section id="registro" class="contenedor">

            <h2>Registro de llegada del vehículo</h2>

            <form>

                <div class="grupo">
                    <label for="placa">Placa del vehículo</label>
                    <input type="text" id="placa" placeholder="Ej: ABC123">
                </div>

                <div class="grupo">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" placeholder="Ej: Toyota">
                </div>

                <div class="grupo">
                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" placeholder="Ej: Corolla">
                </div>

                <div class="grupo">
                    <label for="tipo">Tipo de vehículo</label>

                    <select id="tipo">
                        <option value="">Seleccione...</option>
                        <option>Automóvil</option>
                        <option>Camioneta</option>
                        <option>Motocicleta</option>
                    </select>
                </div>

                <div class="grupo completo">
                    <label for="observaciones">Observaciones / daños encontrados</label>

                    <textarea
                        id="observaciones"
                        rows="4"
                        placeholder="Describa los daños, rayones, defectos u observaciones del vehículo">
                    </textarea>
                </div>


                <div class="botones completo">
                    <button type="reset" class="btn-secundario">
                        Limpiar
                    </button>

                    <button type="submit" class="btn-principal">
                        Registrar vehículo
                    </button>
                </div>

            </form>

        </section>













</body>

 <footer>
        <p>Proyecto Formativo - Sistema de Registro de Lavado de Vehículos</p>
        <p>Cyberlink Solutions S.A.S.</p>

    </footer>


</html>
