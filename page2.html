<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Lavado de Vehículos</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="encabezado">
        <div>
            <h1>Cyberlink Solutions</h1>
        </div>

        <div class="usuario">
            <span><img src="Logo CYBERLINK.png" alt="Logo" style="border-radius: 150px; width: 70px;"></span>
        </div>
    
</header>

<section id="registro" class="contenedor">

            <h2>Inicio Del Sistema</h2>
            </h2>

            <form>

                <div class="grupo">
                    <label for="Usuario">Usuario</label>
                    <input type="text" id="Usuario" placeholder="Ingrese su usuario">
                </div>

                <div class="grupo">
                    <label for="Contraseña">Contraseña</label>
                    <input type="password" id="Contraseña" placeholder="Ingrese su clave">
                </div>

                <div class="grupo completo">
                    

                    <button type="submit" class="btn-principal">
                        Ingresar
                    </button>
                <p><strong>Solo para administradores</strong></p><br><br>
                <a class="error" href="#" class="Inicio-error">¿Tienes problemas para ingresar?<<<</a>
            </div>

            </form>

        </section>
        </body>
